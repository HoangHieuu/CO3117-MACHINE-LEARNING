[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "co3117-machine-learning"
version = "0.1.0"
description = "Individual longitudinal assignment for CO3117 Machine Learning"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["data", "metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
